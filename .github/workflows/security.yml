name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 4 * * 1" # Weekly Monday audit at 04:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DO_NOT_TRACK: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  STORYBOOK_DISABLE_TELEMETRY: "1"
  FALLOW_TELEMETRY_DISABLED: "1"
  REACT_DOCTOR_NO_TELEMETRY: "1"

jobs:
  fork-guard:
    name: Fork Boundary Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate fork PR protected boundaries
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "Inspecting pull request modified files from fork..."
          PROTECTED_PATTERNS=(
            "^\.agents/"
            "^\.github/"
            "^skills-lock\.json$"
            "^lefthook\.yml$"
            "^package\.json$"
            "^bun\.lock$"
            "^\.vscode/"
          )

          CHANGED_FILES=$(git diff --name-only "origin/$BASE_REF...HEAD")

          VIOLATIONS=()
          for file in $CHANGED_FILES; do
            for pattern in "${PROTECTED_PATTERNS[@]}"; do
              if [[ "$file" =~ $pattern ]]; then
                VIOLATIONS+=("$file")
                break
              fi
            done
          done

          if [ ${#VIOLATIONS[@]} -gt 0 ]; then
            echo "::error::Fork PR security boundary violation detected!"
            echo "The following protected files cannot be modified by external forks:"
            for v in "${VIOLATIONS[@]}"; do
              echo "  - $v"
            done
            echo "Per repository governance, only the repository owner (@AhmedHanye) may modify agent instructions (.agents/), workflows (.github/), or core toolchain configs."
            exit 1
          fi
          echo "Fork PR boundary check passed."

  dependency-audit:
    name: Dependency Audit & Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun environment
        uses: ./.github/actions/setup-bun

      - name: Run transitive lockfile audit (Bun)
        # GHSA-vfj7-8cjw-p6xm has no upstream patch yet for braces <=3.0.3
        run: bun audit --audit-level=high --ignore GHSA-vfj7-8cjw-p6xm

      - name: Dependency Review Gate
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        with:
          fail-on-severity: high

  secret-scanning:
    name: Secret Detection (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout full git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog OSS (Incremental PR Scan)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@b2b0a92070f206ab7b5a1105d82a7f2f48d92341 # v3.99.0
        with:
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --results=verified,unverified

      - name: TruffleHog OSS (Full History Scan)
        if: github.event_name != 'pull_request'
        uses: trufflesecurity/trufflehog@b2b0a92070f206ab7b5a1105d82a7f2f48d92341 # v3.99.0
        with:
          extra_args: --results=verified,unverified

  codeql:
    name: CodeQL SAST Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.10
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.10
