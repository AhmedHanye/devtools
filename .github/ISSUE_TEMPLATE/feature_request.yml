name: Feature Request
description: Propose a new feature, improvement, or API extension for DevTools
title: "[Feature]: "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement or new feature for DevTools!
  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Select the package or component this feature pertains to.
      options:
        - "@devtools/cli"
        - "@devtools/api"
        - "@devtools/frontend"
        - "@devtools/core"
        - "@devtools/db"
        - "toolchain / infra"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation? Please describe.
      placeholder: I am frustrated when...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution & API Design Sketch
      description: Describe the solution you'd like to see, including CLI flags, API endpoints, or UI workflows.
      placeholder: DevTools should provide...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions, workarounds, or features you have considered.
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or diagrams about the feature request here.
