# lefthook.yml
# Fast, parallel git pre-commit, commit-msg, and pre-push quality gates
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    lint-and-format:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      run: bunx --bun oxlint --fix {staged_files} && bunx --bun prettier --write {staged_files}
      stage_fixed: true

    format-docs:
      glob: "*.{json,css,md,yml,yaml}"
      run: bunx --bun prettier --write {staged_files}
      stage_fixed: true

    react-doctor:
      glob: "apps/frontend/**/*.{js,jsx,ts,tsx}"
      run: bunx react-doctor apps/frontend --staged --blocking error --no-telemetry --no-supply-chain

    workflow-lint:
      glob: ".github/**/*.{yml,yaml}"
      run: .agents/skills/github-actions/scripts/lint.sh

    verify-secrets:
      run: bun scripts/verify-staged-secrets.ts {staged_files}

    test-scripts:
      glob: "scripts/*"
      run: bun test scripts/

    fast-verification-gate:
      run: bun run verify:fast

commit-msg:
  commands:
    conventional-commits:
      run: bun scripts/verify-commit-msg.ts {1}

pre-push:
  parallel: false
  commands:
    full-verification-gate:
      run: bun run verify
